rule_key: IN-FSSAI-FOOD-NUTRITION-INFO-DECLARED
version: 1
title: "Nutritional information is declared"
citation: >
  Food Safety and Standards (Labelling and Display) Regulations, 2020,
  Regulation 5(3)(b): "Nutritional Information per 100g or 100ml or per
  single consumption pack of the product ... shall be given on the label
  containing the following: - (i) energy value (kcal); (ii) the amounts of
  Protein, Carbohydrate and Total Sugars, Total fat, saturated fat ...
  Sodium". Regulation 5(3)(c) exempts a specific list of foods (e.g. plain
  water, tea, coffee, spices, salt, alcoholic beverages) from mandatory
  nutritional labelling entirely; that exemption list is not modeled here,
  since `LabelFacts` does not carry a food-type classification fine-grained
  enough to test against it - this rule applies the general case. Note:
  given only `field_present` is available to check a list-shaped fact, this
  rule's "fail" outcome is not currently reachable in practice - it can only
  ever resolve to `pass` or `insufficient_data`; this is stated plainly
  rather than papered over with a fabricated fail fixture.
severity: major
effective_from: 2022-07-01
effective_to: null
applicability:
  jurisdiction: ["IN"]
  category: ["packaged_food"]
  predicates: []
logic:
  field_present: nutrition.rows
requires_fields:
  - nutrition.rows
on_missing_fields: insufficient_data
message:
  pass: "Nutritional information is declared on the label."
  fail: "No nutritional information was found on the label."
  insufficient_data: "Could not determine whether nutritional information is declared."
evidence:
  fields:
    - nutrition.rows

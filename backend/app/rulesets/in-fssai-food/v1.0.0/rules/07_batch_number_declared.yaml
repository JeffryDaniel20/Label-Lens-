rule_key: IN-FSSAI-FOOD-BATCH-NUMBER-DECLARED
version: 1
title: "Lot, code, or batch number is declared"
citation: >
  Food Safety and Standards (Labelling and Display) Regulations, 2020,
  Regulation 5(9): "A batch number or code number or lot number shall be
  declared on the label."
severity: major
effective_from: 2022-07-01
effective_to: null
applicability:
  jurisdiction: ["IN"]
  category: ["packaged_food"]
  predicates: []
logic:
  regex_matches:
    path: dates.batch_number
    pattern: "\\S"
requires_fields:
  - dates.batch_number
on_missing_fields: insufficient_data
message:
  pass: "A lot, code, or batch number is declared on the label."
  fail: "The lot, code, or batch number declaration is blank."
  insufficient_data: "Could not determine whether a lot, code, or batch number is declared."
evidence:
  fields:
    - dates.batch_number

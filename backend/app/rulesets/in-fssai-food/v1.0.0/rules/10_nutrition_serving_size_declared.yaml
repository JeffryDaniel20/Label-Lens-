rule_key: IN-FSSAI-FOOD-NUTRITION-SERVING-SIZE-DECLARED
version: 1
title: "Serving size is declared alongside nutritional information"
citation: >
  Food Safety and Standards (Labelling and Display) Regulations, 2020,
  Regulation 5(3)(b)(iv): "Nutrition information panel shall include the
  amount of food in gram (g) or millilitre (ml) for reference beside the
  serving measure and the number of servings in the package."
severity: minor
effective_from: 2022-07-01
effective_to: null
applicability:
  jurisdiction: ["IN"]
  category: ["packaged_food"]
  predicates: []
logic:
  regex_matches:
    path: nutrition.serving_size
    pattern: "\\S"
requires_fields:
  - nutrition.serving_size
on_missing_fields: insufficient_data
message:
  pass: "A serving size is declared alongside the nutritional information."
  fail: "The serving size declaration is blank."
  insufficient_data: "Could not determine whether a serving size is declared."
evidence:
  fields:
    - nutrition.serving_size

rule_key: IN-FSSAI-FOOD-NET-QUANTITY-DECLARED
version: 1
title: "Net quantity is declared"
citation: >
  Food Safety and Standards (Labelling and Display) Regulations, 2020,
  Regulation 5(8): "Declaration and manner of declaration of Net quantity,
  Retail Sale Price and Consumer Care details shall be as provided in Legal
  Metrology Act, 2009 (1 of 2010) and the Rules made there under" - which in
  turn (Legal Metrology (Packaged Commodities) Rules, 2011, Rule 6(1)(c))
  requires "net quantity, in terms of the standard unit of weight or
  measure" on every pre-packaged commodity.
severity: critical
effective_from: 2022-07-01
effective_to: null
applicability:
  jurisdiction: ["IN"]
  category: ["packaged_food"]
  predicates: []
logic:
  regex_matches:
    path: quantity.net_quantity
    pattern: "\\S"
requires_fields:
  - quantity.net_quantity
on_missing_fields: insufficient_data
message:
  pass: "Net quantity is declared on the label."
  fail: "The net quantity declaration is blank."
  insufficient_data: "Could not determine whether net quantity is declared."
evidence:
  fields:
    - quantity.net_quantity

rule_key: IN-FSSAI-FOOD-MANUFACTURE-DATE-DECLARED
version: 1
title: "Date of manufacture or packaging is declared"
citation: >
  Food Safety and Standards (Labelling and Display) Regulations, 2020,
  Regulation 5(10)(a): "'Date of manufacture or packaging' and 'Expiry/Use
  by' shall be declared on the label." (Regulation 8(3) exempts foods with a
  shelf life of seven days or less from this specific declaration, and
  Regulation 8(1)(a) exempts packages smaller than 30 cm^2 - neither
  exemption is modeled here, since `LabelFacts` does not carry shelf-life or
  package-size data; this rule applies the general case.)
severity: major
effective_from: 2022-07-01
effective_to: null
applicability:
  jurisdiction: ["IN"]
  category: ["packaged_food"]
  predicates: []
logic:
  regex_matches:
    path: dates.manufacture_date
    pattern: "\\S"
requires_fields:
  - dates.manufacture_date
on_missing_fields: insufficient_data
message:
  pass: "Date of manufacture or packaging is declared on the label."
  fail: "The date of manufacture or packaging declaration is blank."
  insufficient_data: "Could not determine whether the date of manufacture or packaging is declared."
evidence:
  fields:
    - dates.manufacture_date

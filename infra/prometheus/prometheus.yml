# Prometheus config for the LabelLens API (P7-T5).
#
# Local dev intervals are short (5s) so the acceptance criterion - "a forced
# failure fires the correct alert within 5 minutes" - can actually be
# observed within a normal test session rather than requiring a genuine
# multi-minute wait; a production deployment should widen both to
# 15s/30s-1m, matching typical Prometheus defaults, once dashboards are the
# only consumer of this cadence and no one is watching it fire in real time.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: labellens-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

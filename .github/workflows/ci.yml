name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labellens
          POSTGRES_PASSWORD: labellens
          POSTGRES_DB: labellens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labellens"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LABELLENS_ENVIRONMENT: test
      LABELLENS_SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
      LABELLENS_DATABASE_URL: sqlite://
      LABELLENS_REDIS_URL: memory://
      LABELLENS_COOKIE_SECURE: "false"
      # Enables the PostgreSQL-only RLS and append-only trigger tests.
      LABELLENS_TEST_PG_URL: postgresql+psycopg://labellens:labellens@localhost:5432/labellens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Unit and integration tests
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=85
      - name: Security suite (tenant isolation, authz, CSRF, enumeration)
        run: pytest -q -m security
      # P7-T4's own acceptance line: "suite is a required CI check". Run as
      # its own step rather than folded into the line above so a failure
      # names the adversarial suite directly in the job summary.
      - name: Adversarial suite (IMPLEMENTATION.md section 23's nine families)
        run: pytest -q tests/security/adversarial
      - name: PostgreSQL guarantees (RLS, append-only audit log)
        run: pytest -q -m postgres
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --strict

name: Deploy

# P7-T7: staging -> production deploy pipeline, matching IMPLEMENTATION.md
# section 26 literally: "On merge to main: build + push image, deploy to
# staging, run smoke E2E, await manual approval, deploy to production, run
# migrations, health-check, auto-rollback to previous SHA on failure."
#
# This workflow is authored, YAML-valid, and its image-reference computation
# verified for real (see the deployment-readiness audit that added the
# lowercasing step below) - but has never fired as a real GitHub Actions run
# with real STAGING_*/PRODUCTION_*/GITHUB_TOKEN-backed GHCR access, since
# firing it for real needs every secret named below to be configured by
# whoever operates the real staging/production hosts (D-05, still an open
# decision - single VPS vs Fly/Render - is exactly what those hosts would
# be). None of those secrets, hosts, or registries are fabricated here;
# every one is a GitHub Actions secret an operator must set. The mechanism
# it drives (`infra/scripts/deploy.sh`/`rollback.sh`) *has* been proven for
# real, locally, via `infra/scripts/deploy_drill.sh` - see
# docs/runbooks/deploy-and-rollback.md for the dated drill result.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # GHCR (like every OCI registry) requires an all-lowercase image
      # reference, but `github.repository` is whatever case the repo/account
      # actually use (this repo is "JeffryDaniel20/Label-Lens-", which has
      # both) - computed once here, a genuine deployment-blocking bug caught
      # in a deployment-readiness audit (a straight `${{ github.repository
      # }}` interpolation would have made `docker/build-push-action` reject
      # the tag outright). `registry` is the `REGISTRY` value
      # `infra/scripts/deploy.sh`/`infra/docker-compose.prod.yml` both
      # expect - everything up to, but not including, `/labellens-api`.
      registry: ${{ steps.image.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute a valid, all-lowercase image registry path
        id: image
        run: echo "registry=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d/ -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.image.outputs.registry }}/labellens-api:${{ github.sha }}

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      # `appleboy/ssh-action` runs `infra/scripts/deploy.sh` on the target
      # host itself over SSH - the same script `deploy-production` below
      # runs, and the same one `deploy_drill.sh` proves locally. The host,
      # its SSH key, and every `LABELLENS_*` secret it needs are entirely
      # the operator's own - see infra/docker-compose.prod.yml for the full
      # list of required environment variables.
      - name: Deploy to staging over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /srv/labellens
            git pull
            REGISTRY=${{ needs.build-and-push.outputs.registry }} \
            IMAGE_TAG=${{ github.sha }} \
            COMPOSE_FILE=infra/docker-compose.prod.yml \
              bash infra/scripts/deploy.sh

  smoke-test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test staging's public health endpoint
        run: |
          curl -fsS "https://${{ secrets.STAGING_DOMAIN }}/healthz"
          curl -fsS "https://${{ secrets.STAGING_DOMAIN }}/readyz" | grep -q '"status":"ready"'

  # GitHub's own Environment protection rules (required reviewers,
  # configured by the repo owner on the "production" environment) is the
  # real mechanism behind "await manual approval" - not simulated here, a
  # native platform feature this job's `environment:` key activates.
  deploy-production:
    needs: [build-and-push, smoke-test-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production over SSH (health-gated, auto-rollback on failure)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /srv/labellens
            git pull
            REGISTRY=${{ needs.build-and-push.outputs.registry }} \
            IMAGE_TAG=${{ github.sha }} \
            COMPOSE_FILE=infra/docker-compose.prod.yml \
              bash infra/scripts/deploy.sh
